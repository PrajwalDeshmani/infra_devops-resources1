### **14. Configure Prometheus Federation**

**Task**: Set up **Prometheus Federation** to aggregate metrics from multiple Prometheus instances.

**prometheus-federation.yaml**:
```yaml
scrape_configs:
  - job_name: 'federate'
    honor_labels: true
    metrics_path: '/federate'
    params:
      'match[]': ['up']
    static_configs:
      - targets:
        - 'prometheus-1:9090'
        - 'prometheus-2:9090'
```

