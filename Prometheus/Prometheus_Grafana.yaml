### **3. Configure Prometheus Data Source in Grafana**

**Task**: Add Prometheus as a data source in Grafana using the Grafana UI or configuration.

1. Navigate to **http://<grafana-ip>:3000** (default user: `admin`, password: `admin`).
2. Go to **Configuration** > **Data Sources** > **Add data source**.
3. Choose **Prometheus** and configure it:
   - URL: `http://prometheus-service:9090`
   - Click **Save & Test**.

