### **5. Set Up Alerting in Prometheus**

**Task**: Set up an alert for high CPU usage in Prometheus.

**prometheus-alert.yaml**:
```yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
data:
  alerts.yml: |
    groups:
      - name: example_alerts
        rules:
          - alert: HighCpuUsage
            expr: avg(rate(container_cpu_usage_seconds_total{job="kubernetes-cadvisor"}[5m])) by (instance) > 0.9
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High CPU usage on instance {{ $labels.instance }}"
              description: "CPU usage is above 90% for more than 5 minutes."
```

**Update Prometheus to use the alert config**:
```yaml
      volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-alerts
          mountPath: /etc/prometheus/alerts
      volumes:
        - name: prometheus-alerts
          configMap:
            name: prometheus-alerts
```

**Apply the ConfigMap for Alerts**:
```bash
kubectl apply -f prometheus-alert.yaml
```

