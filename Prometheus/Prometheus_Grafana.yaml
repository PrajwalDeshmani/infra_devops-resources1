### **8. Monitor Kubernetes Cluster Metrics with Prometheus**

**Task**: Use Prometheus to scrape Kubernetes metrics from the kubelet and API server.

**prometheus-kubernetes-config.yaml**:
```yaml
scrape_configs:
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    metrics_path: /metrics/cadvisor
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
```

**Apply the ConfigMap**:
```bash
kubectl apply -f prometheus-kubernetes-config.yaml
```

