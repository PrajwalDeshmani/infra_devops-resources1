### **2. Deploy Grafana on Kubernetes**

**Task**: Deploy Grafana and configure it to read data from Prometheus.

**grafana-deployment.yaml**:
```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:8.4.3
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
```

**grafana-service.yaml**:
```yaml
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
```

**Apply the Grafana Deployment and Service**:
```bash
kubectl apply -f grafana-deployment.yaml
kubectl apply -f grafana-service.yaml
```

