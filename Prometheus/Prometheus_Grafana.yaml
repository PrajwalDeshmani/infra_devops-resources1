### **11. Set Up Custom Metrics with Prometheus Client Libraries**

**Task**: Expose custom application metrics using Prometheus client libraries (e.g., for Python).

**python-metrics.py**:
```python
from prometheus_client import start_http_server, Counter
import random
import time

REQUESTS = Counter('myapp_requests_total', 'Total number of requests')

def process_request():
    REQUESTS.inc(random.randint(1, 5))
    time.sleep(1)

if __name__ == '__main__':
    start_http_server(8000)
    while True:
        process_request()
```

**Expose metrics on port 8000** and configure Prometheus to scrape `http://python-app:8000/metrics`.

