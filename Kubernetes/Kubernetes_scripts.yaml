### **7. Kubernetes Persistent Volume (PV) and Persistent Volume Claim (PVC)**

**Task**: Set up a Persistent Volume and Persistent Volume Claim.

**pv.yaml**:
```yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/data"
```

**pvc.yaml**:
```yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
```

**Pod with PVC**:
```yaml
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod-with-pvc
spec:
  containers:
    - name: nginx
      image: nginx:latest
      volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: nginx-storage
  volumes:
    - name: nginx-storage
      persistentVolumeClaim:
        claimName: nginx-pvc
```

**Apply PV, PVC, and Pod**:
```bash
kubectl apply -f pv.yaml
kubectl apply -f pvc.yaml
kubectl apply -f nginx-pod-with-pvc.yaml
```

