### **11. Kubernetes CronJob**

**Task**: Create a CronJob that runs every minute.

**cronjob.yaml**:
```yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: echo-cronjob
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: echo
              image: busybox
              command:
                - /bin/sh
                - -c
                - "echo Hello, Kubernetes CronJob!"
          restartPolicy: OnFailure
```

**Apply the CronJob**:
```bash
kubectl apply -f cronjob.yaml
```

