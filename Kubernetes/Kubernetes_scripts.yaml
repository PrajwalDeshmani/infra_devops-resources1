### **6. Kubernetes Secret**

**Task**: Create a Kubernetes Secret to store sensitive data like database credentials.

**mysql-secret.yaml**:
```yaml
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  username: bXlzdXItYWRtaW4=  # base64 of "mysql-admin"
  password: cGFzc3dvcmQ=  # base64 of "password"
```

**Apply the Secret**:
```bash
kubectl apply -f mysql-secret.yaml
```

**Access Secret in Pod**:
```yaml
apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
spec:
  containers:
    - name: mysql
      image: mysql:5.7
      env:
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
```

