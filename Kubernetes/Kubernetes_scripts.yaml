### **5. Kubernetes ConfigMap**

**Task**: Create a ConfigMap for a custom Nginx configuration.

**nginx-configmap.yaml**:
```yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    server {
      listen 80;
      location / {
        return 200 'Hello from Kubernetes!';
      }
    }
```

**nginx-deployment-with-configmap.yaml**:
```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-with-configmap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          ports:
            - containerPort: 80
      volumes:
        - name: config-volume
          configMap:
            name: nginx-config
```

**Apply the ConfigMap and Deployment**:
```bash
kubectl apply -f nginx-configmap.yaml
kubectl apply -f nginx-deployment-with-configmap.yaml
```

