### **15. Kubernetes Pod Affinity/Anti-Affinity**

**Task**: Define pod affinity rules to schedule pods on nodes with specific labels.

**pod-affinity.yaml**:
```yaml
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-affinity
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: backend
          topologyKey: "kubernetes.io/hostname"
  containers:
    - name: nginx
      image: nginx
```

**Apply the Pod**:
```bash
kubectl apply -f pod-affinity.yaml
```

