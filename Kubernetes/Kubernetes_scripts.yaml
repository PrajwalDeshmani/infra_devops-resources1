### **13. Kubernetes RBAC (Role-Based Access Control)**

**Task**: Create a Kubernetes Role and RoleBinding to allow a user to view pods.

**role.yaml**:
```yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
```

**rolebinding.yaml**:
```yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: default
subjects:
  - kind: User
    name: jane
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
```

**Apply the Role and RoleBinding**:
```bash
kubectl apply -f role.yaml
kubectl apply -f rolebinding.yaml
```

