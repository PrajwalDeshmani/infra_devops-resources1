### **9. Kubernetes Ingress**

**Task**: Set up an Ingress resource to route traffic to multiple services.

**nginx-ingress.yaml**:
```yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: nginx.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
```

**Apply the Ingress**:
```bash
kubectl apply -f nginx-ingress.yaml
```

