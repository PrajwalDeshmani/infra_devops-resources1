### **12. Kubernetes NetworkPolicy**

**Task**: Restrict traffic between Pods using a NetworkPolicy.

**network-policy.yaml**:
```yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-from-web
spec:
  podSelector:
    matchLabels:
      app: backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 80
```

**Apply the NetworkPolicy**:
```bash
kubectl apply -f network-policy.yaml
```

